[package]
name = "nexmail-desktop"
version = "0.1.0"
description = "Nexmail desktop client"
authors = ["Nexmail contributors"]
edition = "2021"

[lib]
name = "nexmail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
